`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapa do ecossistema — Intelicity</title>
<style>
  :root {
    --text: #1a1225;
    --muted: rgba(26, 18, 37, 0.5);
    --purple: #7c3aed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 40px 24px;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(124, 58, 237, 0.10), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(124, 58, 237, 0.08), transparent 60%),
      #f6f3fc;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { text-align: center; margin-bottom: 8px; }
  header .eyebrow {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(124, 58, 237, 0.6);
  }
  header h1 {
    margin: 8px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
  }
  header h1 em { font-style: normal; color: var(--purple); }
  .card {
    width: 100%; max-width: 920px;
    background: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(26, 18, 37, 0.08);
    border-radius: 14px;
    padding: 20px 24px 28px;
  }
  svg { width: 100%; height: auto; display: block; }
  .t  { font-size: 14px; fill: var(--text); }
  .ts { font-size: 12px; fill: var(--muted); }
  .th { font-size: 15px; font-weight: 700; fill: var(--text); }
  .lbl { font-size: 12px; fill: var(--muted); }
  .node rect { transition: opacity .2s ease; }
  .node:hover rect { opacity: 0.82; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Mapa do ecossistema</div>
  <h1>Peças que <em>se conectam</em>.</h1>
</header>

<div class="card">
<svg viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mapa do ecossistema de produtos da Intelicity</title>
  <desc>IC Fleets é o hub central. Hardwares em campo e Informs alimentam o Fleets; IC Vision e Gravata se conectam ao hub; Gestão de Obras e Zeladoria entregam valor aos clientes; uma fundação de padrões, MCPs e Claude sustenta tudo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="44" y="24" width="11" height="11" rx="2" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="0.75"/>
  <text class="lbl" x="62" y="30" dominant-baseline="central">plataforma central</text>
  <rect x="200" y="24" width="11" height="11" rx="2" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.75"/>
  <text class="lbl" x="218" y="30" dominant-baseline="central">inteligência</text>
  <rect x="330" y="24" width="11" height="11" rx="2" fill="#faece7" stroke="#d85a30" stroke-width="0.75"/>
  <text class="lbl" x="348" y="30" dominant-baseline="central">produtos e apps</text>
  <rect x="500" y="24" width="11" height="11" rx="2" fill="#efece4" stroke="#8a8880" stroke-width="0.75"/>
  <text class="lbl" x="518" y="30" dominant-baseline="central">infra e clientes</text>

  <!-- tier 1: fontes -->
  <g class="node">
    <rect x="95" y="55" width="220" height="50" rx="8" fill="#efece4" stroke="#8a8880" stroke-width="0.75"/>
    <text class="th" x="205" y="75" text-anchor="middle" dominant-baseline="central" fill="#3f3e3a">Hardwares em campo</text>
    <text class="ts" x="205" y="91" text-anchor="middle" dominant-baseline="central">Jetson · Geobox · N100</text>
  </g>
  <g class="node">
    <rect x="365" y="55" width="220" height="50" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.75"/>
    <text class="th" x="475" y="75" text-anchor="middle" dominant-baseline="central" fill="#7a3116">Informs</text>
    <text class="ts" x="475" y="91" text-anchor="middle" dominant-baseline="central">coleta em campo</text>
  </g>

  <!-- tier 2: núcleo -->
  <g class="node">
    <rect x="40" y="150" width="165" height="64" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="0.75"/>
    <text class="th" x="122" y="178" text-anchor="middle" dominant-baseline="central" fill="#0c5e49">IC Vision</text>
    <text class="ts" x="122" y="198" text-anchor="middle" dominant-baseline="central">bronze · prata · ouro</text>
  </g>
  <g class="node">
    <rect x="235" y="150" width="245" height="64" rx="8" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1"/>
    <text class="th" x="357" y="177" text-anchor="middle" dominant-baseline="central" fill="#4a2a94" font-size="17">IC Fleets</text>
    <text class="ts" x="357" y="198" text-anchor="middle" dominant-baseline="central" fill="rgba(76,42,148,0.75)">plataforma · ingestão · alertas</text>
  </g>
  <g class="node">
    <rect x="500" y="150" width="140" height="64" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.75"/>
    <text class="th" x="570" y="178" text-anchor="middle" dominant-baseline="central" fill="#7a3116">Gravata</text>
    <text class="ts" x="570" y="198" text-anchor="middle" dominant-baseline="central">streaming ao vivo</text>
  </g>

  <!-- tier 3: entrega -->
  <g class="node">
    <rect x="147" y="272" width="190" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.75"/>
    <text class="th" x="242" y="295" text-anchor="middle" dominant-baseline="central" fill="#7a3116">Gestão de Obras</text>
    <text class="ts" x="242" y="312" text-anchor="middle" dominant-baseline="central">produto de prateleira</text>
  </g>
  <g class="node">
    <rect x="377" y="272" width="190" height="56" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="0.75"/>
    <text class="th" x="472" y="295" text-anchor="middle" dominant-baseline="central" fill="#7a3116">Zeladoria</text>
    <text class="ts" x="472" y="312" text-anchor="middle" dominant-baseline="central">app do cidadão</text>
  </g>

  <!-- tier 4: clientes -->
  <g class="node">
    <rect x="207" y="384" width="300" height="48" rx="8" fill="#efece4" stroke="#8a8880" stroke-width="0.75"/>
    <text class="th" x="357" y="403" text-anchor="middle" dominant-baseline="central" fill="#3f3e3a">Clientes</text>
    <text class="ts" x="357" y="418" text-anchor="middle" dominant-baseline="central">SABESP · órgãos públicos · munícipes</text>
  </g>

  <!-- fundação -->
  <rect x="60" y="462" width="560" height="74" rx="8" fill="none" stroke="rgba(26,18,37,0.28)" stroke-width="0.75" stroke-dasharray="4 4"/>
  <text class="th" x="76" y="483" text-anchor="start" dominant-baseline="central" fill="#4a2a94">Fundação · como construímos</text>
  <text class="ts" x="604" y="483" text-anchor="end" dominant-baseline="central">sustenta todo o ecossistema</text>
  <rect x="76" y="502" width="150" height="24" rx="12" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="0.6"/>
  <text class="ts" x="151" y="514" text-anchor="middle" dominant-baseline="central" fill="rgba(76,42,148,0.85)">IcePanel + ADRs</text>
  <rect x="246" y="502" width="90" height="24" rx="12" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="0.6"/>
  <text class="ts" x="291" y="514" text-anchor="middle" dominant-baseline="central" fill="rgba(76,42,148,0.85)">MCPs</text>
  <rect x="356" y="502" width="180" height="24" rx="12" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="0.6"/>
  <text class="ts" x="446" y="514" text-anchor="middle" dominant-baseline="central" fill="rgba(76,42,148,0.85)">Claude corporativo</text>

  <!-- conectores -->
  <g stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <line x1="205" y1="107" x2="315" y2="148" marker-end="url(#arrow)"/>
    <line x1="475" y1="107" x2="400" y2="148" marker-end="url(#arrow)"/>
    <line x1="228" y1="176" x2="207" y2="176" marker-end="url(#arrow)"/>
    <line x1="207" y1="190" x2="228" y2="190" marker-end="url(#arrow)"/>
    <line x1="482" y1="176" x2="498" y2="176" marker-end="url(#arrow)"/>
    <line x1="498" y1="190" x2="482" y2="190" marker-end="url(#arrow)"/>
    <line x1="340" y1="214" x2="255" y2="270" marker-end="url(#arrow)"/>
    <line x1="374" y1="214" x2="459" y2="270" marker-end="url(#arrow)"/>
    <line x1="255" y1="328" x2="310" y2="382" marker-end="url(#arrow)"/>
    <line x1="459" y1="328" x2="404" y2="382" marker-end="url(#arrow)"/>
  </g>
</svg>
</div>
</body>
</html>
